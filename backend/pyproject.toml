[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".venv312", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "DJ"]
ignore = [
    "S105",  # hardcoded-password strings are schema/example placeholders
    "S106",  # hardcoded-password function args in tests
    "S101",  # asserts are the test mechanism
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "S311"]
"accounts/management/commands/**/*.py" = ["S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
show_error_codes = true
exclude = ["migrations/", "tests/", "\\.venv/", "\\.venv312/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::django.utils.deprecation.RemovedInDjango60Warning",
    "error::django.utils.deprecation.RemovedInDjango61Warning",
]

[tool.coverage.run]
branch = true
source = ["accounts", "core", "config"]
omit = [
    "*/migrations/*",
    "*/__init__.py",
    "config/settings/*",
    "config/wsgi.py",
    "config/asgi.py",
    "manage.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
